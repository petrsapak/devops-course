route:
  receiver: local-console
  group_by: [alertname, job]
  group_wait: 15s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers:
        - severity="page"
      receiver: local-console

receivers:
  - name: local-console

inhibit_rules:
  - source_matchers:
      - severity="page"
    target_matchers:
      - severity="warning"
    equal: [alertname, job]
