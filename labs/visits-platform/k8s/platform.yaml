apiVersion: v1
kind: Namespace
metadata:
  name: visits
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: visits-config
  namespace: visits
data:
  APP_VERSION: local
  DB_HOST: postgres
  FEATURE_STATS: "false"
  POSTGRES_DB: visits
  POSTGRES_USER: visits
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: visits-api
  namespace: visits
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: visits-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: visits-api
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: ghcr.io/example/visits-api:replace-me
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: visits-config
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: visits-db
                  key: password
          ports:
            - name: http
              containerPort: 8000
          startupProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 96Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: visits-api
  namespace: visits
spec:
  selector:
    app.kubernetes.io/name: visits-api
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: visits-worker
  namespace: visits
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: visits-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: visits-worker
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: ghcr.io/example/visits-worker:replace-me
          imagePullPolicy: IfNotPresent
          command: [python, -m, app.worker]
          envFrom:
            - configMapRef:
                name: visits-config
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: visits-db
                  key: password
          ports:
            - name: metrics
              containerPort: 8001
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
---
apiVersion: v1
kind: Service
metadata:
  name: visits-worker
  namespace: visits
spec:
  selector:
    app.kubernetes.io/name: visits-worker
  ports:
    - name: metrics
      port: 8001
      targetPort: metrics
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: visits-api
  namespace: visits
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: visits-api
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: visits-api
  namespace: visits
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: visits-api
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: api-ingress
  namespace: visits
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: visits-api
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8000
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: postgres
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: visits
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: postgres:16.4-alpine
          env:
            - name: POSTGRES_DB
              value: visits
            - name: POSTGRES_USER
              value: visits
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: visits-db
                  key: password
          ports:
            - name: postgres
              containerPort: 5432
          readinessProbe:
            exec:
              command: [pg_isready, -U, visits]
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: visits
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - name: postgres
      port: 5432
