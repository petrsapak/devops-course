apiVersion: v1
kind: Service
metadata:
  name: {{ include "visits.fullname" . }}-api
  labels:
    {{- include "visits.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "visits.fullname" . }}-worker
  labels:
    {{- include "visits.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: worker
  ports:
    - name: metrics
      port: 8001
      targetPort: metrics
