name: Reusable Python checks

on:
  workflow_call:
    inputs:
      python-version:
        description: Python version used for tests
        required: false
        default: "3.12"
        type: string

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      TEST_DATABASE_URL: postgresql://visits:integration-test@127.0.0.1:5432/visits
    services:
      postgres:
        image: postgres:16.4-alpine
        env:
          POSTGRES_DB: visits
          POSTGRES_PASSWORD: integration-test
          POSTGRES_USER: visits
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U visits -d visits"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ inputs.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install --requirement requirements-dev.txt
      - run: pytest --quiet
